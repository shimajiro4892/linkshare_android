# android/ が変わるたびに署名済みAPKをビルドし、Release「latest」に添付する。
# 端末からは https://github.com/shimajiro4892/linkshare_android/releases/latest/download/linkshare-android.apk でダウンロードできる。
name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::署名鍵の Secrets（KEYSTORE_BASE64 など）が未設定です。README の「APK のビルド」を参照してください。"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon test assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APK_VERSION_CODE: ${{ github.run_number }}

      - name: Publish to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk linkshare-android.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest linkshare-android.apk \
            --title "リンクシェア Android APK (build ${{ github.run_number }})" \
            --notes "共有メニューに「リンクシェア」を追加するAndroidアプリ。Brave など Chrome 以外のブラウザ用。インストール後、任意のアプリの共有メニューから「リンクシェア」を選ぶ。" \
            --latest
